name: CI/CD com Docker

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'
  REGISTRY: docker.io
  IMAGE_NAME: projeto-integrador2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # ✅ Melhoria 1: Cache NuGet para restauração mais rápida
    - name: Setup NuGet cache
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    # ✅ Melhoria 5: Executar testes e gerar artefatos
    - name: Run tests with coverage
      run: dotnet test --no-build --configuration Release --verbosity normal --logger trx --results-directory TestResults

    # ✅ Melhoria 5: Upload de resultados de teste
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: TestResults/
        retention-days: 30

  
  docker-build-push:
    needs: build-and-test          
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    # ✅ Melhoria 2: Setup Docker Buildx para otimizar builds
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver-options: network=host

    # ✅ Melhoria 3: Gerar metadata para tags inteligentes
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: docker-build-push
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
    - name: Trigger Render deploy
      if: env.RENDER_API_KEY != '' && env.RENDER_SERVICE_ID != ''
      run: |
        curl --fail-with-body --retry 3 --silent --show-error \
          --request POST "https://api.render.com/deploy/srv-${RENDER_SERVICE_ID}" \
          --header "Authorization: Bearer ${RENDER_API_KEY}"