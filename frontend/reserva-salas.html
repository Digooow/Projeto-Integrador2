<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ocupa · Reserva de Salas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12161f;
    --bg-panel:#191f2b;
    --surface:#212938;
    --surface-2:#2a3346;
    --border:#323d52;
    --accent:#f2a93b;
    --accent-dim:#8a6a2c;
    --accent-2:#4fd1c5;
    --accent-2-dim:#2a6b64;
    --danger:#ef5b5b;
    --danger-dim:#7a3232;
    --text:#f2f0ea;
    --text-dim:#9aa3b2;
    --text-faint:#69728a;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;margin:0;font-weight:600;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::selection{background:var(--accent);color:#1a1408;}

  a{color:var(--accent);}

  /* ---------- layout shells ---------- */
  #app{min-height:100vh;display:flex;flex-direction:column;}
  .container{max-width:1080px;margin:0 auto;padding:0 20px;width:100%;}

  /* ---------- login ---------- */
  .login-wrap{
    flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(242,169,59,0.10), transparent),
      radial-gradient(ellipse 700px 500px at 100% 110%, rgba(79,209,197,0.08), transparent),
      var(--bg);
  }
  .login-card{max-width:480px;width:100%;}
  .brandmark{
    display:inline-flex;align-items:center;gap:10px;margin-bottom:28px;
  }
  .brandmark .dot{
    width:10px;height:10px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 4px rgba(242,169,59,0.18);
  }
  .brandmark span{font-family:'IBM Plex Mono',monospace;letter-spacing:.14em;font-size:12px;color:var(--text-dim);text-transform:uppercase;}
  .login-card h1{font-size:34px;line-height:1.15;margin-bottom:10px;}
  .login-card .sub{color:var(--text-dim);font-size:15px;line-height:1.55;margin-bottom:28px;}
  .login-card .field-label{display:block;color:var(--text-dim);font-size:12px;margin-bottom:6px;}
  .login-card .text-input{width:100%;box-sizing:border-box;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;color:var(--text);margin-bottom:16px;}
  .login-card .text-input:focus{outline:none;border-color:var(--accent);}
  .userlist{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
  .user-btn{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 16px;text-align:left;color:var(--text);transition:border-color .15s, background .15s;
  }
  .user-btn:hover{border-color:var(--accent);background:var(--surface-2);}
  .user-btn .name{font-weight:600;font-size:15px;}
  .user-btn .role{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .user-btn .arrow{color:var(--accent);font-family:'IBM Plex Mono',monospace;}
  .tv-link{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    background:transparent;border:1px dashed var(--border);border-radius:var(--radius);
    padding:13px 16px;color:var(--text-dim);font-size:13px;letter-spacing:.03em;
  }
  .tv-link:hover{border-color:var(--accent-2);color:var(--accent-2);}

  /* ---------- top bar ---------- */
  header.topbar{
    border-bottom:1px solid var(--border);background:var(--bg-panel);position:sticky;top:0;z-index:20;
  }
  .topbar-inner{display:flex;align-items:center;gap:18px;padding:14px 20px;max-width:1080px;margin:0 auto;flex-wrap:wrap;}
  .topbar-brand{display:flex;align-items:center;gap:8px;margin-right:6px;}
  .topbar-brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}
  .topbar-brand b{font-family:'Space Grotesk',sans-serif;font-size:16px;}
  nav.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;}
  nav.tabs button{
    background:transparent;border:none;color:var(--text-dim);padding:8px 12px;border-radius:8px;
    font-size:13.5px;white-space:nowrap;font-weight:500;transition:background .15s,color .15s;
  }
  nav.tabs button:hover{color:var(--text);background:var(--surface);}
  nav.tabs button.active{color:var(--bg);background:var(--accent);font-weight:600;}
  .topbar-right{display:flex;align-items:center;gap:8px;}
  .who{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25;}
  .who .n{font-size:13px;font-weight:600;}
  .who .r{font-size:11px;color:var(--text-dim);}
  .icon-btn{
    background:var(--surface);border:1px solid var(--border);color:var(--text-dim);
    border-radius:8px;padding:8px 11px;font-size:12.5px;font-weight:500;
  }
  .icon-btn:hover{color:var(--text);border-color:var(--accent-2);}
  .icon-btn.warn:hover{border-color:var(--danger);color:var(--danger);}

  main{flex:1;padding:28px 0 60px;}
  .page-head{margin-bottom:22px;}
  .page-head h2{font-size:22px;margin-bottom:4px;}
  .page-head p{color:var(--text-dim);font-size:14px;margin:0;max-width:640px;line-height:1.5;}

  /* ---------- cards / generic ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
  .card + .card{margin-top:12px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  @media(max-width:640px){.grid-2,.grid-3{grid-template-columns:1fr;}}

  label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;font-weight:500;}
  .field{margin-bottom:14px;}
  input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],select,textarea{
    width:100%;background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;
    padding:10px 12px;color:var(--text);font-size:14px;outline:none;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  textarea{resize:vertical;min-height:70px;}
  .hint{font-size:12px;color:var(--text-faint);margin-top:5px;}
  .error-text{font-size:12.5px;color:var(--danger);margin-top:5px;font-weight:500;}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    font-size:12px;padding:4px 10px;border-radius:20px;background:var(--surface-2);
    border:1px solid var(--border);color:var(--text-dim);
  }
  .chip.on{background:rgba(242,169,59,0.15);border-color:var(--accent);color:var(--accent);}
  .day-toggle{
    display:flex;gap:5px;flex-wrap:wrap;
  }
  .day-toggle button{
    width:42px;height:38px;border-radius:8px;border:1px solid var(--border);background:var(--bg-panel);
    color:var(--text-dim);font-size:12.5px;font-weight:600;
  }
  .day-toggle button.on{background:var(--accent);border-color:var(--accent);color:#1a1408;}

  .btn{
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface-2);
    color:var(--text);border-radius:8px;padding:10px 16px;font-size:13.5px;font-weight:600;
  }
  .btn:hover{border-color:var(--accent);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1408;}
  .btn.primary:hover{filter:brightness(1.06);}
  .btn.teal{background:var(--accent-2);border-color:var(--accent-2);color:#062522;}
  .btn.ghost{background:transparent;}
  .btn.danger{background:transparent;border-color:var(--danger-dim);color:var(--danger);}
  .btn.danger:hover{border-color:var(--danger);}
  .btn.small{padding:6px 11px;font-size:12px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}

  .badge{font-size:11px;font-weight:700;letter-spacing:.03em;padding:3px 9px;border-radius:20px;text-transform:uppercase;}
  .badge.pending{background:rgba(242,169,59,0.16);color:var(--accent);}
  .badge.approved{background:rgba(79,209,197,0.16);color:var(--accent-2);}
  .badge.rejected{background:rgba(239,91,91,0.16);color:var(--danger);}
  .badge.cancelled{background:rgba(154,163,178,0.14);color:var(--text-dim);}
  .badge.role{background:var(--surface-2);color:var(--text-dim);}

  .empty{
    text-align:center;padding:44px 20px;color:var(--text-faint);border:1px dashed var(--border);border-radius:var(--radius);
  }
  .empty b{display:block;color:var(--text-dim);font-size:14.5px;margin-bottom:4px;font-weight:600;}

  .row-between{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .meta-line{color:var(--text-dim);font-size:13px;line-height:1.6;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--text-faint);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;padding:0 10px 8px;}
  td{padding:11px 10px;border-top:1px solid var(--border);vertical-align:middle;}
  tr:hover td{background:rgba(255,255,255,0.015);}

  .conflict-box{
    margin-top:12px;background:rgba(239,91,91,0.08);border:1px solid var(--danger-dim);border-radius:8px;padding:12px 14px;
  }
  .conflict-box .title{color:var(--danger);font-size:12.5px;font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:.02em;}
  .conflict-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-top:1px solid rgba(239,91,91,0.18);}
  .conflict-item:first-child{border-top:none;}
  .conflict-item .d{font-size:13px;}
  .conflict-item .who{font-size:12px;color:var(--text-dim);}

  .fyi{
    margin-top:10px;font-size:12px;color:var(--accent);background:rgba(242,169,59,0.08);
    border:1px solid var(--accent-dim);border-radius:8px;padding:8px 12px;
  }

  /* toast */
  #toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
  .toast{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:9px;
    font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,0.35);animation:toastin .18s ease-out;
  }
  .toast.warn{border-color:var(--accent);}
  .toast.err{border-color:var(--danger);color:var(--danger);}
  @keyframes toastin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- TV panel ---------- */
  .tv-body{background:#0c0f16;min-height:100vh;color:var(--text);}
  .tv-head{
    display:flex;justify-content:space-between;align-items:center;padding:26px 44px 18px;
    border-bottom:1px solid var(--border);
  }
  .tv-head .left{display:flex;align-items:center;gap:16px;}
  .tv-head .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px rgba(242,169,59,0.16);}
  .tv-head h1{font-size:26px;letter-spacing:.01em;}
  .tv-head .shift{
    font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--accent);letter-spacing:.12em;text-transform:uppercase;margin-top:2px;
  }
  .tv-head .clock{font-family:'IBM Plex Mono',monospace;font-size:38px;font-weight:600;letter-spacing:.03em;}
  .tv-head .datestr{font-size:13px;color:var(--text-dim);text-align:right;margin-top:2px;text-transform:capitalize;}
  .tv-exit{position:fixed;top:18px;right:18px;z-index:50;opacity:.35;}
  .tv-exit:hover{opacity:1;}

  .tv-floors{padding:20px 44px 50px;display:flex;flex-direction:column;gap:26px;}
  .tv-floor-label{
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-faint);
    display:flex;align-items:center;gap:12px;margin-bottom:10px;
  }
  .tv-floor-label::after{content:"";flex:1;height:1px;background:var(--border);}
  .tv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;}
  .tv-card{
    background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;position:relative;overflow:hidden;
  }
  .tv-card.live{border-color:var(--accent-2);background:linear-gradient(180deg, rgba(79,209,197,0.10), rgba(25,31,43,1) 55%);}
  .tv-card .room-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .tv-card .room-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;}
  .tv-card .cap{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-faint);}
  .tv-card .status-live{
    display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--accent-2);
  }
  .tv-card .status-live .pulse{
    width:7px;height:7px;border-radius:50%;background:var(--accent-2);animation:pulse 1.4s infinite;
  }
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,209,197,0.55);}70%{box-shadow:0 0 0 7px rgba(79,209,197,0);}100%{box-shadow:0 0 0 0 rgba(79,209,197,0);}}
  .tv-card .activity{font-size:15px;font-weight:600;margin-bottom:3px;}
  .tv-card .resp{font-size:12.5px;color:var(--text-dim);}
  .tv-card .time{
    font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--accent);margin-top:10px;letter-spacing:.02em;
  }
  .tv-card .free{color:var(--text-faint);font-size:14px;font-family:'IBM Plex Mono',monospace;letter-spacing:.04em;}
  .tv-card .next{font-size:11.5px;color:var(--text-faint);margin-top:8px;border-top:1px solid var(--border);padding-top:8px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(6,8,12,0.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px;max-width:480px;width:100%;}
</style>
</head>
<body>
<div id="toast-wrap"></div>
<div id="app"></div>

<script>
/* ======================= API CONFIG ======================= */
// Points at the ASP.NET Core backend (Program.cs / Domain / Persistence).
// Override at runtime without editing this file: set window.OCUPA_API_BASE
// in an inline script placed before this one, or append ?api=<url> to the page URL.
const API_BASE = (function(){
  const fromQuery = new URLSearchParams(location.search).get('api');
  if(fromQuery) return fromQuery.replace(/\/$/,'');
  if(window.OCUPA_API_BASE) return window.OCUPA_API_BASE.replace(/\/$/,'');
  return (location.hostname==='localhost'||location.hostname==='127.0.0.1')
    ? 'http://localhost:5000'
    : 'https://projeto-integrador2-latest.onrender.com';
})();

/* ======================= STATE ======================= */
const DAY_NAMES = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const FLOOR_ORDER = ['Térreo','1º andar','2º andar','3º andar','4º andar'];

const St = {
  users:[], rooms:[], resources:[], bookings:[],
  currentUserId:null,
  authToken: sessionStorage.getItem('ocupa_access_token') || null,
  view:'login',
  loaded:false,
  transient:{ conflicts:{}, calDate: todayStr(), showAddRoom:false, editRoomId:null, showAddUser:false, editUserId:null, showRegister:false, requestMode:'pontual', reqDays:[2,4], listPages:{ my:1, approvals:1 } }
};

/* ======================= UTIL ======================= */
function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function pad(n){ return String(n).padStart(2,'0'); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dateStr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function hhmm(d){ return pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtBR(iso){ const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y; }
function fmtLongBR(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('pt-BR',{weekday:'long', day:'2-digit', month:'long'});
}
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function timeOverlap(s1,e1,s2,e2){ return s1<e2 && s2<e1; }
function getShift(d=new Date()){ const h=d.getHours(); if(h<12) return 'Manhã'; if(h<18) return 'Tarde'; return 'Noite'; }
function currentUser(){ return St.users.find(u=>u.id===St.currentUserId) || null; }
function sortedFloors(list){
  const uniq = [...new Set(list)];
  return uniq.sort((a,b)=>{
    const ia = FLOOR_ORDER.indexOf(a), ib = FLOOR_ORDER.indexOf(b);
    if(ia===-1 && ib===-1) return a.localeCompare(b);
    if(ia===-1) return 1; if(ib===-1) return -1;
    return ia-ib;
  });
}
function toast(msg, kind){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast'+(kind?' '+kind:'');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 3600);
}

/* ======================= API CLIENT ======================= */
// The frontend's role/status vocabulary (pt-BR, lowercase) differs from the
// backend's C# enums — these two tables are the single place that translates
// between them.
const ROLE_FRONT_TO_BACK = { requisitante:'Teacher', coordenador:'Coordinator', admin:'Administrator' };
const ROLE_BACK_TO_FRONT = { Teacher:'requisitante', Collaborator:'requisitante', Coordinator:'coordenador', Administrator:'admin' };
const STATUS_BACK_TO_FRONT = { Pending:'pending', Approved:'approved', Rejected:'rejected', Cancelled:'cancelled' };

async function api(path, options){
  const headers = { 'Content-Type':'application/json' };
  if(St.authToken) headers.Authorization = `Bearer ${St.authToken}`;
  const res = await fetch(API_BASE + path, {
    method: (options && options.method) || 'GET',
    headers,
    body: options && options.body ? JSON.stringify(options.body) : undefined
  });
  let data = null;
  try{ data = await res.json(); }catch(e){ /* no body */ }
  if(res.status===401 && St.authToken){
    St.authToken = null;
    sessionStorage.removeItem('ocupa_access_token');
    if(St.currentUserId){
      St.currentUserId = null; St.view = 'login'; render();
      toast('Sua sessão expirou. Entre novamente para continuar.', 'err');
    }
  }
  if(!res.ok){
    const err = new Error((data && data.error) || `Falha na comunicação com o servidor (${res.status}).`);
    err.status = res.status; err.data = data;
    throw err;
  }
  return data;
}

function isoLocal(date, time){ return date+'T'+time+':00'; } // sent as-is; server treats it as a plain local timestamp

async function fetchUsers(){
  const rows = await api('/api/users');
  return rows.map(u=>({ id:u.id, name:u.name, email:u.email, role:ROLE_BACK_TO_FRONT[u.role]||'requisitante', floors:u.floors||[], active:u.active }));
}
async function fetchCatalog(){
  const includeInactive = currentUser()?.role==='admin' ? '?includeInactive=true' : '';
  const [rooms, resources] = await Promise.all([
    api('/api/rooms'+includeInactive),
    api('/api/resources')
  ]);
  return {
    resources: resources.map(r=>({ id:r.id, name:r.name })),
    rooms: rooms.map(r=>({ id:r.id, name:r.name, floor:r.floor, capacity:r.capacity, description:r.description, resourceIds:r.resourceIds, active:r.active }))
  };
}
async function fetchBookings(status){
  const statusQuery = status ? `&status=${encodeURIComponent(status)}` : '';
  const response = await api(`/api/reservations?page=1&pageSize=100${statusQuery}`);
  const rows = Array.isArray(response) ? response : (response.data || []);
  return rows.map(mapBooking);
}
function mapBooking(r){
    const start = new Date(r.occurrence.start), end = new Date(r.occurrence.end);
    return {
      id:String(r.id), seriesId:r.seriesId?String(r.seriesId):null,
      roomId:r.roomId, requesterId:r.requesterId, title:r.title, responsavel:r.responsavel,
      turmaSize:r.attendees, date:dateStr(start), startTime:hhmm(start), endTime:hhmm(end),
      status:STATUS_BACK_TO_FRONT[r.status]||'pending',
      createdAt:r.createdAt, decidedBy:r.decidedBy, decidedAt:r.decidedAt
    };
}
async function loadPublicData(){
  const [catalog, bookings] = await Promise.all([fetchCatalog(), fetchBookings('Approved')]);
  St.users = seedUsers();
  St.rooms = catalog.rooms; St.resources = catalog.resources; St.bookings = bookings;
  St.loaded = true; St.offline = false;
}
async function loadRemoteData(){
  const [users, catalog, bookings] = await Promise.all([fetchUsers(), fetchCatalog(), fetchBookings()]);
  St.users = users; St.rooms = catalog.rooms; St.resources = catalog.resources; St.bookings = bookings;

/* ======================= DOMAIN HELPERS ======================= */
function visibleRoomsFor(user){
  if(!user) return [];
  if(user.role==='admin') return St.rooms;
  if(user.role==='coordenador') return St.rooms.filter(r=>user.floors.includes(r.floor));
  return St.rooms; // requisitante can request in any room
}
function roomById(id){ return St.rooms.find(r=>r.id===id); }
function userById(id){ return St.users.find(u=>u.id===id); }
function resourceNames(ids){ return (ids||[]).map(id=>{ const r=St.resources.find(x=>x.id===id); return r?r.name:null; }).filter(Boolean); }

function conflictsForInstance(b, statuses){
  statuses = statuses || ['approved'];
  return St.bookings.filter(o=> o.id!==b.id && o.roomId===b.roomId && o.date===b.date && statuses.includes(o.status) && timeOverlap(b.startTime,b.endTime,o.startTime,o.endTime));
}
function generateSeriesDates(startDate,endDate,daysOfWeek){
  const out = [];
  const start = new Date(startDate+'T00:00:00');
  const end = new Date(endDate+'T00:00:00');
  for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
    if(daysOfWeek.includes(d.getDay())) out.push(dateStr(d));
  }
  return out;
}
function pendingGroupsFor(user){
  const rooms = new Set(visibleRoomsFor(user).map(r=>r.id));
  const pending = St.bookings.filter(b=> b.status==='pending' && rooms.has(b.roomId));
  const groups = {};
  pending.forEach(b=>{
    const key = b.seriesId ? ('s:'+b.seriesId) : ('b:'+b.id);
    if(!groups[key]) groups[key] = { key, seriesId:b.seriesId, instances:[] };
    groups[key].instances.push(b);
  });
  return Object.values(groups).map(g=>{ g.instances.sort((a,b)=>a.date.localeCompare(b.date)); return g; });
}
function myGroupsFor(user){
  const mine = St.bookings.filter(b=>b.requesterId===user.id);
  const groups = {};
  mine.forEach(b=>{
    const key = b.seriesId ? ('s:'+b.seriesId) : ('b:'+b.id);
    if(!groups[key]) groups[key] = { key, seriesId:b.seriesId, instances:[] };
    groups[key].instances.push(b);
  });
  return Object.values(groups).map(g=>{ g.instances.sort((a,b)=>a.date.localeCompare(b.date)); return g; }).sort((a,b)=> b.instances[0].createdAt.localeCompare(a.instances[0].createdAt));
}

window.submitRequest = async function(ev){
  ev.preventDefault();
  const f = ev.target;
  const user = currentUser();
  const roomId = f.roomId.value;
  const title = f.title.value.trim();
  const responsavel = f.responsavel.value.trim() || user.name;
  const turmaSize = parseInt(f.turmaSize.value||'0',10);
  const room = roomById(roomId);
  const errBox = document.getElementById('req-error');
  errBox.textContent='';

  if(!title){ errBox.textContent='Informe o nome da aula ou atividade.'; return; }
  if(room && turmaSize > room.capacity){
    errBox.textContent = `A turma informada (${turmaSize} alunos) não cabe nesta sala — capacidade máxima: ${room.capacity}. Escolha outra sala ou ajuste o número de alunos.`;
    return;
  }

  const mode = St.transient.requestMode;
  let payload;

  if(mode==='pontual'){
    const date = f.date.value, startTime=f.startTime.value, endTime=f.endTime.value;
    if(!date || !startTime || !endTime){ errBox.textContent='Preencha data e horário.'; return; }
    if(startTime>=endTime){ errBox.textContent='O horário final precisa ser depois do horário inicial.'; return; }
    payload = { requesterId:user.id, roomId, title, responsavel, attendees:turmaSize,
      start:isoLocal(date,startTime), end:isoLocal(date,endTime), recurrence:null };
  } else {
    const startDate=f.startDate.value, endDate=f.endDate.value, startTime=f.startTimeR.value, endTime=f.endTimeR.value;
    const days = St.transient.reqDays;
    if(!startDate || !endDate){ errBox.textContent='Informe o período (data de início e de fim).'; return; }
    if(startDate>endDate){ errBox.textContent='A data final precisa ser depois da data inicial.'; return; }
    if(!startTime || !endTime){ errBox.textContent='Preencha o horário.'; return; }
    if(startTime>=endTime){ errBox.textContent='O horário final precisa ser depois do horário inicial.'; return; }
    if(days.length===0){ errBox.textContent='Selecione ao menos um dia da semana.'; return; }
    if(generateSeriesDates(startDate,endDate,days).length===0){ errBox.textContent='Nenhuma data cai nos dias selecionados dentro do período informado.'; return; }
    payload = { requesterId:user.id, roomId, title, responsavel, attendees:turmaSize,
      start:isoLocal(startDate,startTime), end:isoLocal(startDate,endTime),
      recurrence:{ days, until:isoLocal(endDate,'00:00') } };
  }

  try{
    const result = await api('/api/reservations', { method:'POST', body:payload });
    St.bookings = await fetchBookings();
    toast(result.count>1 ? `Pedido enviado — ${result.count} aula(s) serão criadas de uma vez se aprovado.` : 'Pedido enviado — você será avisado quando for avaliado.');
  }catch(e){ errBox.textContent = e.message; return; }

  f.reset();
  St.transient.requestMode='pontual';
  St.transient.reqDays=[2,4];
  render();
};

function deciderBody(){ return { userId: St.currentUserId, role: ROLE_FRONT_TO_BACK[currentUser().role] }; }

window.decideGroup = async function(groupKey){
  const instances = St.bookings.filter(b=>{
    if(groupKey.startsWith('s:')) return b.seriesId===groupKey.slice(2) && b.status==='pending';
    return ('b:'+b.id)===groupKey && b.status==='pending';
  });
  let approvedCount=0; const conflictList=[];
  for(const b of instances){
    try{
      await api(`/api/reservations/${b.id}/approve`, { method:'POST', body: deciderBody() });
      approvedCount++;
    }catch(e){
      if(e.status===409 && e.data && e.data.conflicts){
        conflictList.push({ bookingId:b.id, conflicts: e.data.conflicts.map(c=>c.id) });
      } else {
        toast(e.message,'err');
      }
    }
  }
  St.bookings = await fetchBookings();
  if(conflictList.length===0){
    delete St.transient.conflicts[groupKey];
    toast(`${approvedCount} reserva(s) confirmada(s).`);
  } else {
    St.transient.conflicts[groupKey]=conflictList;
    toast(`${approvedCount} confirmada(s). ${conflictList.length} com conflito de horário — revise abaixo.`,'warn');
  }
  render();
};
window.rejectGroup = async function(groupKey){
  const instances = St.bookings.filter(b=>{
    const inGroup = groupKey.startsWith('s:') ? b.seriesId===groupKey.slice(2) : ('b:'+b.id)===groupKey;
    return inGroup && b.status==='pending';
  });
  for(const b of instances){
    try{ await api(`/api/reservations/${b.id}/reject`, { method:'POST', body: deciderBody() }); }
    catch(e){ toast(e.message,'err'); }
  }
  delete St.transient.conflicts[groupKey];
  St.bookings = await fetchBookings();
  toast('Pedido rejeitado.');
  render();
};
window.forceApprove = async function(bookingId, groupKey){

};

function renderShell(user){
  const tabs = [];
  if(user.role==='requisitante'){
    tabs.push(['request','Solicitar sala'], ['my','Minhas solicitações']);
  }
  if(user.role==='coordenador' || user.role==='admin'){
    tabs.push(['approvals','Aprovações'], ['calendar','Calendário'], ['request','Solicitar sala'], ['my','Minhas solicitações']);
  }
  if(user.role==='admin' || user.role==='coordenador'){
    tabs.push(['rooms','Salas e recursos']);
  }
  if(user.role==='admin'){
    tabs.push(['users','Usuários']);

  const view = tabs.find(t=>t[0]===St.view) ? St.view : tabs[0][0];

  let content;
  if(view==='request') content = renderRequestView(user);
  else if(view==='my') content = renderMyView(user);
  else if(view==='approvals') content = renderApprovalsView(user);
  else if(view==='calendar') content = renderCalendarView(user);
  else if(view==='rooms') content = renderRoomsView(user);
  else if(view==='users') content = renderUsersView(user);
  else content = renderRequestView(user);

  return `

      <div class="topbar-brand"><span class="dot"></span><b>Ocupa</b></div>
      <nav class="tabs">

      <div class="topbar-right">

function renderPagination(view, page, pageSize, total){
  const totalPages = Math.ceil(total/pageSize);

    <button class="btn small" ${page===1?'disabled':''} onclick="setListPage('${view}',${page-1})">Anterior</button>

    <button class="btn small" ${page===totalPages?'disabled':''} onclick="setListPage('${view}',${page+1})">Próxima</button>

}
function statusCounts(instances){
  const c = {pending:0,approved:0,rejected:0,cancelled:0};
  instances.forEach(b=>c[b.status]++);
  return c;
}
function renderMyGroupCard(g){
  const first = g.instances[0];

      }

function badgeSummary(c){
  const parts=[];
  if(c.pending) parts.push(`<span class="badge pending">${c.pending} pendente${c.pending>1?'s':''}</span>`);
  if(c.approved) parts.push(`<span class="badge approved">${c.approved} confirmada${c.approved>1?'s':''}</span>`);
  if(c.rejected) parts.push(`<span class="badge rejected">${c.rejected} rejeitada${c.rejected>1?'s':''}</span>`);
  if(c.cancelled) parts.push(`<span class="badge cancelled">${c.cancelled} cancelada${c.cancelled>1?'s':''}</span>`);
  return `<div class="chip-row" style="gap:5px">${parts.join('')}</div>`;
}

function renderApprovalCard(g, allGroups){
  const first = g.instances[0];
  const room = roomById(first.roomId);
  const requester = userById(first.requesterId);
  const isSeries = !!g.seriesId;
  const rangeLabel = isSeries
    ? `${g.instances.length} aula(s) de ${fmtBR(g.instances[0].date)} a ${fmtBR(g.instances[g.instances.length-1].date)} · ${daysLabelFromInstances(g.instances)} · ${first.startTime}–${first.endTime}`
    : `${fmtBR(first.date)} · ${first.startTime}–${first.endTime}`;

  // FYI against other pending groups
  const fyi = [];
  g.instances.forEach(b=>{
    const otherPendingConflicts = St.bookings.filter(o=> o.status==='pending' && o.roomId===b.roomId && o.date===b.date && o.id!==b.id && timeOverlap(b.startTime,b.endTime,o.startTime,o.endTime) && (!b.seriesId || o.seriesId!==b.seriesId));
    otherPendingConflicts.forEach(o=>{ const req=userById(o.requesterId); fyi.push(`${fmtBR(b.date)}: também disputado por "${esc(o.title)}" (${esc(req?req.name:'—')})`); });
  });
  const fyiUniq = [...new Set(fyi)];

  const conflictData = St.transient.conflicts[g.key];

  return `
  <div class="card">
    <div class="row-between">
      <div>
        <h3 style="font-size:16px;margin-bottom:4px;">${esc(first.title)}</h3>
        <div class="meta-line">${esc(room?room.name:'—')} ${room?'· '+esc(room.floor)+' · até '+room.capacity+' pessoas':''}</div>
        <div class="meta-line">${rangeLabel}</div>
        <div class="meta-line">Solicitado por: ${esc(requester?requester.name:'—')} · Responsável: ${esc(first.responsavel)} · ${first.turmaSize} pessoa(s)${room && first.turmaSize>room.capacity ? ' <span style="color:var(--danger)">⚠ acima da capacidade</span>' : ''}</div>
      </div>
      <span class="badge pending">Pendente</span>
    </div>
    ${fyiUniq.length ? `<div class="fyi">⚠ ${fyiUniq.join(' · ')}</div>` : ''}
    ${conflictData && conflictData.length ? renderConflictBox(conflictData, g.key) : ''}
    <div class="btn-row">
      <button class="btn teal" onclick="decideGroup('${g.key}')">Aprovar ${isSeries?'todas ('+g.instances.length+')':''}</button>
      <button class="btn danger" onclick="rejectGroup('${g.key}')">Rejeitar ${isSeries?'todas':''}</button>
    </div>
  </div>`;
}
function renderConflictBox(conflictData, groupKey){
  return `<div class="conflict-box">
    <div class="title">Conflito com reserva já confirmada</div>
    ${conflictData.map(cd=>{
      const b = St.bookings.find(x=>x.id===cd.bookingId);
      const others = cd.conflicts.map(cid=>St.bookings.find(x=>x.id===cid)).filter(Boolean);
      return `<div class="conflict-item">
        <div>
          <div class="d">${fmtBR(b.date)} · ${b.startTime}–${b.endTime}</div>
          <div class="who">Já ocupada por: ${others.map(o=>esc(o.title)+' ('+esc(o.responsavel)+')').join(', ')}</div>
        </div>
        <div class="btn-row" style="margin:0">
          <button class="btn small" onclick="forceApprove('${b.id}','${groupKey}')">Aprovar mesmo assim</button>
          <button class="btn danger small" onclick="rejectInstance('${b.id}','${groupKey}')">Rejeitar este dia</button>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}
function daysLabelFromInstances(instances){
  const days = [...new Set(instances.map(b=> new Date(b.date+'T00:00:00').getDay()))].sort();
  return days.map(d=>DAY_NAMES[d]).join('/');
}

/* ======================= RENDER: CALENDAR ======================= */
function renderCalendarView(user){
  const rooms = sortedFloors(visibleRoomsFor(user).map(r=>r.floor)).flatMap(fl => visibleRoomsFor(user).filter(r=>r.floor===fl));
  const date = St.transient.calDate;
  const dayBookings = St.bookings.filter(b=> b.date===date && rooms.some(r=>r.id===b.roomId) && b.status!=='cancelled' && b.status!=='rejected');

  let currentFloor = null;
  let rows = '';
  rooms.forEach(r=>{
    if(r.floor!==currentFloor){ rows += `<div class="tv-floor-label" style="margin-top:16px;">${esc(r.floor)}</div>`; currentFloor=r.floor; }
    const items = dayBookings.filter(b=>b.roomId===r.id).sort((a,b)=>a.startTime.localeCompare(b.startTime));
    // detect overlaps within this room/day
    const conflictIds = new Set();
    items.forEach((a,i)=>items.forEach((b,j)=>{ if(i<j && timeOverlap(a.startTime,a.endTime,b.startTime,b.endTime)){ conflictIds.add(a.id); conflictIds.add(b.id);} }));
    rows += `<div class="card">
      <div class="row-between"><h3 style="font-size:15px;">${esc(r.name)} <span class="mono" style="color:var(--text-faint);font-size:12px;">até ${r.capacity}</span></h3></div>
      ${items.length===0 ? `<div class="meta-line" style="margin-top:6px;">Sem reservas nesta data.</div>` : items.map(b=>{
        const req = userById(b.requesterId);
        return `<div class="row-between" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);">
          <div>
            <div style="font-size:13.5px;font-weight:600;">${esc(b.title)} ${conflictIds.has(b.id)?'<span style="color:var(--danger);font-weight:700;">⚠ conflito</span>':''}</div>
            <div class="meta-line">${b.startTime}–${b.endTime} · ${esc(b.responsavel)} · pedido de ${esc(req?req.name:'—')}</div>
          </div>
          <span class="badge ${b.status}">${statusLabel(b.status)}</span>
        </div>`;
      }).join('')}
    </div>`;
  });

  return `
  <div class="page-head"><h2>Calendário do prédio</h2><p>Veja tudo que está reservado num dia, por sala, e identifique sobreposições antes que virem problema na porta.</p></div>
  <div class="card" style="margin-bottom:14px;">
    <div class="field" style="margin-bottom:0;max-width:220px;">
      <label>Data</label>
      <input type="date" value="${date}" onchange="setCalDate(this.value)">
    </div>
  </div>
  ${rows || `<div class="empty"><b>Nenhuma sala disponível</b></div>`}
  `;
}

function renderUserForm(u, floors){

  return `<form class="card" onsubmit="submitUser(event, ${isEdit?`'${u.id}'`:'null'})" style="border-color:var(--accent-dim);" id="user-form">
    <div class="grid-2">
      <div class="field"><label>Nome</label><input type="text" name="name" value="${isEdit?esc(u.name):''}" required></div>
      <div class="field"><label>E-mail</label><input type="email" name="email" value="${isEdit?esc(u.email):''}" required></div>
    </div>
    <div class="field">
      <label>Papel</label>
      <select name="role" onchange="this.form.querySelector('.floor-block').style.display = this.value==='coordenador' ? 'block' : 'none'">
        <option value="requisitante" ${isEdit&&u.role==='requisitante'?'selected':''}>Professor(a) / colaborador(a) — só pode pedir salas</option>
        <option value="coordenador" ${isEdit&&u.role==='coordenador'?'selected':''}>Coordenador(a) delegado(a) — aprova só nos andares dele(a)</option>
        <option value="admin" ${isEdit&&u.role==='admin'?'selected':''}>Coordenação geral — acesso completo</option>
      </select>
    </div>
    <div class="field floor-block" style="display:${isEdit&&u.role==='coordenador'?'block':'none'};">
      <label>Andares sob responsabilidade</label>
      <div class="chip-row">
        ${floors.map(f=>`<label class="chip" style="cursor:pointer;display:inline-flex;gap:6px;align-items:center;">
          <input type="checkbox" name="floor" value="${esc(f)}" ${isEdit && u.floors.includes(f)?'checked':''} style="width:auto;"> ${esc(f)}
        </label>`).join('')}
      </div>
    </div>
    <div class="btn-row">
      <button type="submit" class="btn primary">${isEdit?'Salvar alterações':'Cadastrar usuário'}</button>
      <button type="button" class="btn ghost" onclick="cancelUserEdit()">Cancelar</button>
    </div>
  </form>`;
}

/* ======================= RENDER: TV ======================= */
let tvTimerHandle = null;
function attachTVTimer(){
  if(tvTimerHandle) clearInterval(tvTimerHandle);
  tvTimerHandle = setInterval(async ()=>{
    // refresh clock every tick; re-pull shared data periodically to reflect changes from other sessions
    const clockEl = document.getElementById('tv-clock');
    if(clockEl) clockEl.textContent = hhmm(new Date())+':'+pad(new Date().getSeconds());
    if(new Date().getSeconds()===0){
      try{ St.bookings = await fetchBookings('Approved'); }catch(e){ /* keep showing last known data */ }
      render();
    }
  }, 1000);
}
function renderTV(){
  const now = new Date();
  const date = todayStr();
  const shift = getShift(now);
  const rooms = St.rooms.filter(r=>r.active);
  const floors = sortedFloors(rooms.map(r=>r.floor));
  const todays = St.bookings.filter(b=>b.date===date && b.status==='approved');

  const body = floors.map(floor=>{
    const floorRooms = rooms.filter(r=>r.floor===floor);
    return `<div>
      <div class="tv-floor-label">${esc(floor)}</div>
      <div class="tv-grid">
        ${floorRooms.map(r=>renderTVCard(r, todays, now)).join('')}
      </div>
    </div>`;
  }).join('');

  return `
  <div class="tv-body">
    <button class="icon-btn tv-exit" onclick="closeTV()">Sair do modo TV ✕</button>
    <div class="tv-head">
      <div class="left">
        <span class="dot"></span>
        <div>
          <h1>Ocupa · O que está rolando agora</h1>
          <div class="shift">Turno da ${shift.toLowerCase()}</div>
        </div>
      </div>
      <div style="text-align:right;">
        <div class="clock" id="tv-clock">${hhmm(now)}:${pad(now.getSeconds())}</div>
        <div class="datestr">${fmtLongBR(date)}</div>
      </div>
    </div>
    <div class="tv-floors">${body}</div>
  </div>`;
}
function renderTVCard(room, todays, now){
  const nowStr = hhmm(now);
  const items = todays.filter(b=>b.roomId===room.id).sort((a,b)=>a.startTime.localeCompare(b.startTime));
  const live = items.find(b=> b.startTime<=nowStr && nowStr<b.endTime);
  const next = !live ? items.find(b=> b.startTime>nowStr) : null;
  return `<div class="tv-card ${live?'live':''}">
    <div class="room-row">
      <span class="room-name">${esc(room.name)}</span>
      <span class="cap">ATÉ ${room.capacity}</span>
    </div>
    ${live ? `
      <div class="status-live"><span class="pulse"></span> AO VIVO</div>
      <div class="activity" style="margin-top:6px;">${esc(live.title)}</div>
      <div class="resp">${esc(live.responsavel)}</div>
      <div class="time">${live.startTime} – ${live.endTime}</div>
    ` : `
      <div class="free">— livre agora —</div>
      ${next ? `<div class="next">Próxima: ${esc(next.title)} às ${next.startTime}</div>` : ''}
    `}
  </div>`;
}

/* ======================= BOOT ======================= */
async function boot(){
  try{
    await (St.authToken ? loadRemoteData() : loadPublicData());
  }catch(e){
    // Keep the public panel usable while exposing whether the API was offline
    // or responded with a server error.
    St.users = seedUsers();
    const cat = seedCatalog(); St.rooms = cat.rooms; St.resources = cat.resources;
    St.bookings = seedBookings();
    St.loaded = true;
    St.offline = true;
    St.serverError = e.status >= 500;
    console.error('Não foi possível conectar à API em', API_BASE, e);
  }
  render();
  if(St.offline){
    const message = St.serverError
      ? `O servidor respondeu com erro (${API_BASE}) — mostrando dados de demonstração locais.`
      : `Sem conexão com o servidor (${API_BASE}) — mostrando dados de demonstração locais.`;
    toast(message, 'err');
  }
}
boot();
